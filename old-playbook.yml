---
- name: Install ClickHouse
  hosts: clickhouse
  become: true
  tasks:
    - name: Get ClickHouse distrib
      ansible.builtin.get_url:
        url: "https://packages.clickhouse.com/deb/pool/main/c/clickhouse/clickhouse-common-static_22.3.3.44_amd64.deb"
        dest: "/tmp/clickhouse-common-static.deb"
    - name: Install ClickHouse packages
      ansible.builtin.apt:
        deb: "/tmp/clickhouse-common-static.deb"
    - name: Set listen_host in config
      ansible.builtin.lineinfile:
        path: /etc/clickhouse-server/config.xml
        regexp: '<listen_host>'
        line: '    <listen_host>0.0.0.0</listen_host>'
    - name: Start ClickHouse
      ansible.builtin.service:
        name: clickhouse-server
        state: started
        enabled: true
    - name: Create database
      ansible.builtin.command: clickhouse-client --query "CREATE DATABASE IF NOT EXISTS logs"

- name: Install Vector
  hosts: vector
  become: true
  tasks:
    - name: Download Vector
      ansible.builtin.get_url:
        url: "https://packages.timber.io/vector/0.34.1/vector-0.34.1-x86_64-unknown-linux-gnu.tar.gz"
        dest: "/tmp/vector.tar.gz"
    - name: Unpack Vector
      ansible.builtin.unarchive:
        src: "/tmp/vector.tar.gz"
        dest: "/opt/"
        remote_src: true
    - name: Create Vector config
      ansible.builtin.copy:
        dest: /etc/vector/vector.toml
        content: |
          [sources.in]
            type = "syslog"
            address = "0.0.0.0:514"
          [sinks.out]
            type = "clickhouse"
            inputs = ["in"]
            endpoint = "http://127.0.0.1:8123"
            table = "logs"
            database = "logs"
    - name: Create systemd unit for Vector
      ansible.builtin.copy:
        dest: /etc/systemd/system/vector.service
        content: |
          [Unit]
          Description=Vector
          After=network.target
          [Service]
          ExecStart=/opt/vector-x86_64-unknown-linux-gnu/bin/vector --config /etc/vector/vector.toml
          Restart=always
          [Install]
          WantedBy=multi-user.target
    - name: Start Vector
      ansible.builtin.systemd:
        name: vector
        state: started
        enabled: true
        daemon_reload: true

- name: Install LightHouse
  hosts: lighthouse
  become: true
  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
    - name: Download LightHouse
      ansible.builtin.get_url:
        url: "https://github.com/VKCOM/lighthouse/archive/refs/heads/master.zip"
        dest: "/tmp/lighthouse.zip"
    - name: Unpack LightHouse
      ansible.builtin.unarchive:
        src: "/tmp/lighthouse.zip"
        dest: "/var/www/"
        remote_src: true
    - name: Configure Nginx for LightHouse
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/default
        content: |
          server {
              listen 80 default_server;
              root /var/www/lighthouse-master;
              index index.html;
              location / {
                  try_files $uri $uri/ =404;
              }
          }
    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted